spring.application.name=task-time-tracker

# Default datasource for local run (tests override it via Testcontainers ServiceConnection)
spring.datasource.url=jdbc:h2:mem:task_time_tracker;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# SQL init
spring.sql.init.mode=always

# MyBatis
mybatis.config-location=classpath:mybatis-config.xml
mybatis.mapper-locations=classpath*:mappers/*.xml
