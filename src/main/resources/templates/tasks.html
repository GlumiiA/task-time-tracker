<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tasks</title>
    <link rel="stylesheet" href="/ui.css">
</head>
<body>
<main class="page">
    <header class="topbar">
        <div>
            <h1>Task Time Tracker</h1>
            <p class="muted" th:text="${principal.username + ' / ' + principal.role}"></p>
        </div>
        <form method="post" action="/ui/logout">
            <button class="secondary" type="submit">Выйти</button>
        </form>
    </header>

    <div class="alert success" th:if="${message}" th:text="${message}"></div>
    <div class="alert error" th:if="${error}" th:text="${error}"></div>

    <section class="grid">
        <form class="panel" method="post" action="/ui/tasks">
            <h2>Создать задачу</h2>
            <label>
                Название
                <input name="title" required maxlength="100">
            </label>
            <label>
                Описание
                <textarea name="description" maxlength="500"></textarea>
            </label>
            <label>
                Исполнитель
                <select name="assigneeId">
                    <option value="">Без исполнителя</option>
                    <option th:each="employee : ${employees}"
                            th:value="${employee.id}"
                            th:text="${employee.id + ' - ' + employee.username}"></option>
                </select>
            </label>
            <button type="submit">Создать</button>
        </form>

        <form class="panel" method="post" action="/ui/time-records">
            <h2>Записать время</h2>
            <label>
                Сотрудник
                <select name="employeeId" required>
                    <option th:each="employee : ${employees}"
                            th:value="${employee.id}"
                            th:selected="${employee.id == principal.id}"
                            th:text="${employee.id + ' - ' + employee.username}"></option>
                </select>
            </label>
            <label>
                Задача
                <input name="taskId" type="number" min="1" required>
            </label>
            <label>
                Начало
                <input name="startTime" type="datetime-local" required>
            </label>
            <label>
                Конец
                <input name="endTime" type="datetime-local" required>
            </label>
            <label>
                Что сделано
                <textarea name="workDescription" maxlength="1000"></textarea>
            </label>
            <button type="submit">Сохранить</button>
        </form>
    </section>

    <section class="panel">
        <h2>Задачи</h2>
        <form class="filters" method="get" action="/ui/tasks">
            <select name="assigneeId">
                <option value="">Все исполнители</option>
                <option th:each="employee : ${employees}"
                        th:value="${employee.id}"
                        th:selected="${employee.id == selectedAssigneeId}"
                        th:text="${employee.id + ' - ' + employee.username}"></option>
            </select>
            <select name="status">
                <option value="">Все статусы</option>
                <option th:each="status : ${statuses}"
                        th:value="${status}"
                        th:selected="${status.name() == selectedStatus}"
                        th:text="${status}"></option>
            </select>
            <button class="secondary" type="submit">Фильтр</button>
            <a class="link-button" href="/ui/tasks">Сбросить</a>
        </form>

        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Название</th>
                    <th>Статус</th>
                    <th>Исполнитель</th>
                    <th>Автор</th>
                    <th>Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="task : ${tasks}">
                    <td th:text="${task.id}"></td>
                    <td>
                        <strong th:text="${task.title}"></strong>
                        <div class="muted" th:text="${task.description}"></div>
                    </td>
                    <td th:text="${task.status}"></td>
                    <td th:text="${task.assigneeId}"></td>
                    <td th:text="${task.createdBy}"></td>
                    <td class="actions">
                        <form method="post" action="/ui/tasks/status">
                            <input type="hidden" name="taskId" th:value="${task.id}">
                            <select name="status">
                                <option th:each="status : ${statuses}"
                                        th:value="${status}"
                                        th:selected="${status == task.status}"
                                        th:text="${status}"></option>
                            </select>
                            <button class="secondary" type="submit">OK</button>
                        </form>
                        <form method="post" action="/ui/tasks/assignee">
                            <input type="hidden" name="taskId" th:value="${task.id}">
                            <select name="assigneeId" required>
                                <option th:each="employee : ${employees}"
                                        th:value="${employee.id}"
                                        th:selected="${employee.id == task.assigneeId}"
                                        th:text="${employee.username}"></option>
                            </select>
                            <button class="secondary" type="submit">OK</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(tasks)}">
                    <td colspan="6" class="empty">Задач пока нет</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
