<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Task Time Tracker</title>
    <link rel="stylesheet" href="/ui.css">
</head>
<body>
<main class="page page-narrow">
    <h1>Task Time Tracker</h1>
    <p class="muted">Минимальный UI для ручной проверки сервиса.</p>

    <div class="alert error" th:if="${error}" th:text="${error}"></div>

    <form class="panel" method="post" action="/ui/login">
        <label>
            Логин
            <input name="username" value="admin" required>
        </label>
        <label>
            Пароль
            <input name="password" type="password" value="password" required>
        </label>
        <button type="submit">Войти</button>
    </form>

    <p class="muted">Тестовые пользователи: `admin/password`, `employee/password`.</p>
</main>
</body>
</html>
