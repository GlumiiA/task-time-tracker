# Datasource is provided by Testcontainers @ServiceConnection.
# Initialize DB schema from schema.sql for tests.
spring.sql.init.mode=always

# MyBatis
mybatis.config-location=classpath:mybatis-config.xml
mybatis.mapper-locations=classpath*:mappers/*.xml

app.jwt.secret=change-this-secret-to-at-least-32-characters
app.jwt.issuer=task-time-tracker
app.jwt.access-token-ttl=1h
